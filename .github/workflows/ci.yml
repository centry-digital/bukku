# Quality gates for every pull request and every push to main.
# Each job is a separately named check so it can be marked as required in GitHub
# (see docs/github-setup.md). Keep job ids and names identical and in sync with that guide.
#
# This repository is public, so every job runs on GitHub's machines (free for public
# repositories). Never point it at Centry's self-hosted AWS runners: anyone could run code on
# them through a pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces the run still going on the same PR or on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Source (tsc --build) plus the test files and scripts/ that the build skips.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # The CLI integration and MCP startup tests run the bundled binaries, so build first.
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Builds both packages, checks what npm would publish, and starts each binary once.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the published packages don't depend on the internal core package
        run: |
          for pkg in mcp cli; do
            (cd "packages/$pkg" && npm pack --dry-run)
            node -e "
              const pkg = require('./packages/$pkg/package.json');
              const deps = Object.keys(pkg.dependencies || {});
              if (deps.some((d) => d.includes('core'))) {
                console.error('::error::core must not be in the published dependencies of ' + pkg.name);
                process.exit(1);
              }
              console.log(pkg.name + ' dependencies OK: ' + deps.join(', '));
            "
          done
      - name: Start each binary
        run: |
          node packages/cli/build/index.js --version
          # Without credentials the MCP server must exit 1 with its setup checklist, not crash.
          set +e
          BUKKU_API_TOKEN= BUKKU_COMPANY_SUBDOMAIN= node packages/mcp/build/index.js 2> mcp-stderr.txt
          code=$?
          set -e
          cat mcp-stderr.txt
          if [ "$code" != 1 ] || ! grep -q "Setup checklist" mcp-stderr.txt; then
            echo "::error::The MCP server did not start cleanly (exit $code)."
            exit 1
          fi

      # Catches files left out of (or wrongly added to) the npm tarballs, which the repo checkout hides.
      - name: Check each packed tarball's contents, then install and start it
        run: |
          expected="LICENSE README.md build/index.js package.json"
          for pkg in mcp cli; do
            files=$(cd "packages/$pkg" && npm pack --dry-run --json | node -e "
              let s = ''; process.stdin.on('data', (d) => (s += d)).on('end', () =>
                console.log(JSON.parse(s)[0].files.map((f) => f.path).sort().join(' ')));")
            if [ "$files" != "$expected" ]; then
              echo "::error::packages/$pkg would publish: $files (expected: $expected)"
              exit 1
            fi
            cmp -s LICENSE "packages/$pkg/LICENSE" || { echo "::error::packages/$pkg/LICENSE differs from LICENSE"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/packed" "$RUNNER_TEMP/install"
          npm pack --workspace packages/mcp --workspace packages/cli --pack-destination "$RUNNER_TEMP/packed"
          cd "$RUNNER_TEMP/install"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/packed/*.tgz
          npx --no-install bukku --version
          set +e
          BUKKU_API_TOKEN= BUKKU_COMPANY_SUBDOMAIN= npx --no-install bukku-mcp 2> mcp-stderr.txt
          code=$?
          set -e
          if [ "$code" != 1 ] || ! grep -q "Setup checklist" mcp-stderr.txt; then
            cat mcp-stderr.txt
            echo "::error::The installed MCP server did not start cleanly (exit $code)."
            exit 1
          fi

  # Every MCP tool must have a CLI command (scripts/verify-parity.ts).
  parity:
    name: parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify:parity

  deps-audit:
    name: deps-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Blocks on high or critical advisories in what ships (production dependencies).
      # Development-only advisories are reported for information and tracked by Dependabot.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report development dependencies (non-blocking)
        run: npm audit --audit-level=high || echo "::warning::npm audit reports advisories in development dependencies"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks runs from its official image, so no third-party action needs allow-listing.
      - name: Scan the full git history with gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.28.0
          git --redact --verbose --exit-code 1 /repo
