# Release flow:
# 1. Update the version in packages/mcp/package.json and/or packages/cli/package.json
#    (a package whose version is already on npm is skipped)
# 2. git commit + git tag
# 3. git push && git push --tags
# 4. Create GitHub release from the tag
# 5. This workflow auto-publishes both packages to npm via trusted publishing (OIDC)

name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # The same checks as CI (format, lint, build, typecheck, tests, parity), so nothing
      # unverified reaches npm even if a release is cut from a commit CI never saw.
      - name: Verify
        run: npm run verify

      # A release can bump only one package: a version already on npm is skipped, not an error.
      - name: Publish to npm
        run: |
          for pkg in mcp cli; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on npm; skipping."
            else
              npm publish --workspace "packages/$pkg" --provenance
            fi
          done
